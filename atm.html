<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATM Simulator</title>
</head>
<body>
    <script>
        let Balance = 1000;
        let PIN = 1234;
        let enteredPIN = prompt("Enter your PIN");

        if (enteredPIN == PIN) {
            let running = true;

            while (running) {
                let choice = prompt("1.Check balance, 2.Deposit, 3.Withdraw, 4.Exit");

                if (choice == "1") {
                    console.log("Current balance: " + Balance);

                } else if (choice == "2") {
                    let deposit = Number(prompt("How much do you want to deposit?"));

                    if (deposit <= 0) {
                        console.log("Invalid deposit amount");
                    } else {
                        Balance = Balance + deposit;
                        console.log("Balance after deposit: " + Balance);
                    }

                } else if (choice == "3") {
                    let withdraw = Number(prompt("Enter amount to withdraw"));

                    if (withdraw <= 0) {
                        console.log("Invalid withdrawal amount");
                    } else if (withdraw > Balance) {
                        console.log("Insufficient balance");
                    } else {
                        Balance = Balance - withdraw;
                        console.log("Balance after withdrawal: " + Balance);
                    }

                } else if (choice == "4") {
                    console.log("Exited");
                    running = false;

                } else {
                    console.log("Invalid choice");
                }
            }

        } else {
            console.log("Incorrect PIN");
        }
    </script>
</body>
</html>
